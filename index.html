    <script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState } = React;

// ===== notes.js =====
// Génération et données des notes
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const SOLFEGE = ["Do", "Do#", "Ré", "Ré#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "La#", "Si"];

function midiToName(midi) {
  return NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
}

function midiToSolf(midi) {
  return SOLFEGE[midi % 12] + (Math.floor(midi / 12) - 1);
}

// Clavier AZERTY : rangée du bas = touches blanches, rangée du haut = touches noires.
// 25 étiquettes couvrent Do3 → Do5 (toute la tessiture ténor en paysage).
const KEY_LABELS = [
  "Q", "Z", // Do3, Do#3
  "S", "E", // Ré3, Ré#3
  "D",      // Mi3
  "F", "T", // Fa3, Fa#3
  "G", "Y", // Sol3, Sol#3
  "H", "U", // La3, La#3
  "J",      // Si3
  "K", "O", // Do4, Do#4
  "L", "P", // Ré4, Ré#4
  "M",      // Mi4
  "W", "N", // Fa4, Fa#4
  "X", ",", // Sol4, Sol#4
  "C", ";", // La4, La#4
  "V",      // Si4
  "B",      // Do5
];

// Construit un clavier de `count` demi-tons à partir de `startMidi`
function buildKeys(startMidi, count = 17) {
  const keys = [];
  let whiteIndex = -1;
  for (let i = 0; i < count; i++) {
    const midi = startMidi + i;
    const semitone = midi % 12;
    const isBlack =
      semitone === 1 || semitone === 3 || semitone === 6 || semitone === 8 || semitone === 10;
    if (!isBlack) whiteIndex++;
    keys.push({
      id: `n${midi}`,
      midi,
      name: midiToName(midi),
      solfege: midiToSolf(midi),
      isBlack,
      whiteBefore: whiteIndex,
      keyLabel: KEY_LABELS[i] || null,
    });
  }
  return keys;
}

function buildKeyMap(keys) {
  const map = {};
  keys.forEach((k) => {
    if (k.keyLabel) map[k.keyLabel.toLowerCase()] = k;
  });
  return map;
}

// ===== audio.js =====
// Synthèse type piano : partiels harmoniques avec inharmonicité légère,
// attaque percussive et décrément naturel (graves plus longs que les aigus).
let ctx = null;
let silentEl = null;

// Génère un WAV d'une seconde de silence (8 kHz, 8 bits) sans fichier externe.
function makeSilentWavUrl() {
  const sampleRate = 8000;
  const n = sampleRate;
  const buf = new ArrayBuffer(44 + n);
  const view = new DataView(buf);
  const w = (off, s) => {
    for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i));
  };
  w(0, "RIFF");
  view.setUint32(4, 36 + n, true);
  w(8, "WAVE");
  w(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true);
  view.setUint16(32, 1, true);
  view.setUint16(34, 8, true);
  w(36, "data");
  view.setUint32(40, n, true);
  for (let i = 0; i < n; i++) view.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}

// Contournement du mode silencieux iOS : Web Audio est coupé quand le
// commutateur de sonnerie est en position silencieuse. La lecture d'un
// élément média (ici une seconde de silence en boucle, quasi inaudible)
// bascule la session audio en mode « lecture », qui ignore ce commutateur.
// Sans effet sur les navigateurs qui ne mute pas Web Audio (Android, desktop).
function bypassSilentSwitch() {
  try {
    if (!silentEl) {
      silentEl = document.createElement("audio");
      silentEl.src = makeSilentWavUrl();
      silentEl.loop = true;
      silentEl.preload = "auto";
      silentEl.setAttribute("playsinline", "true");
    }
    const p = silentEl.play();
    if (p && typeof p.catch === "function") p.catch(() => {});
  } catch (err) {
    /* rien : le mode silencieux ne pourra pas être contourné */
  }
}

// Crée (ou réveille) le contexte audio. À appeler dans un geste utilisateur.
// Renvoie le contexte, ou null si l'audio est indisponible.
function ensureAudio() {
  if (!ctx) {
    try {
      // Profil "interactive" : tampons de sortie les plus courts possible,
      // pour minimiser la latence entre l'appui et le son.
      ctx = new window.AudioContext({ latencyHint: "interactive" });
    } catch (err) {
      ctx = null;
      return null;
    }
  }
  if (ctx.state !== "running") {
    try {
      const p = ctx.resume();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch (err) {
      /* rien */
    }
  }
  bypassSilentSwitch();
  return ctx;
}

function audioState() {
  return ctx ? ctx.state : "absent";
}

// Partiels typiques d'une corde de piano : fondamentale dominante,
// harmoniques décroissants, très légèrement étirés (inharmonicité).
const PARTIALS = [
  { ratio: 1.0, gain: 1.0 },
  { ratio: 2.0, gain: 0.42 },
  { ratio: 3.0, gain: 0.2 },
  { ratio: 4.0, gain: 0.1 },
  { ratio: 5.0, gain: 0.05 },
];

class Synth {
  constructor() {
    this.active = new Map();
  }

  noteOn(id, freq, { volume = 0.6 } = {}) {
    if (this.active.has(id)) return true;
    const c = ensureAudio();
    if (!c) return false;
    const now = c.currentTime;

    const master = c.createGain();
    const peak = Math.max(0.001, volume);

    // Les notes aiguës s'éteignent plus vite que les graves
    const decayTime = Math.min(6, Math.max(1.2, 880 / freq));

    // Enveloppe : attaque quasi instantanée (3 ms), puis décrément exponentiel naturel
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(peak, now + 0.003);
    master.gain.setTargetAtTime(Math.max(peak * 0.18, 0.001), now + 0.003, decayTime / 4);

    const oscs = [];
    PARTIALS.forEach((p, i) => {
      try {
        const osc = c.createOscillator();
        osc.type = "sine";
        const f = freq * p.ratio * (1 + i * 0.0008); // inharmonicité légère
        osc.frequency.value = f;
        const g = c.createGain();
        // Les harmoniques aigus s'atténuent dans les notes hautes
        g.gain.value = p.gain * (i === 0 ? 1 : Math.min(1, 220 / f + 0.35));
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        oscs.push(osc);
      } catch (err) {
        /* partiel ignoré */
      }
    });

    master.connect(c.destination);
    // Filet de sécurité : on coupe tout après la queue naturelle
    oscs.forEach((o) => {
      try {
        o.stop(now + decayTime + 8);
      } catch (err) {
        /* rien */
      }
    });

    this.active.set(id, { master, oscs, startedAt: now, peak, decayTime });
    return c.state === "running";
  }

  noteOff(id, release = 0.25) {
    const v = this.active.get(id);
    if (!v) return;
    this.active.delete(id);
    const c = ensureAudio();
    if (!c) return;
    const t = c.currentTime;
    const rel = Math.max(0.05, release);
    const param = v.master.gain;
    try {
      // Gèle l'automatisation à sa valeur courante si possible
      if (typeof param.cancelAndHoldAtTime === "function") {
        param.cancelAndHoldAtTime(t);
      } else {
        param.cancelScheduledValues(t);
      }
      const cur = Math.max(param.value, 0.0001);
      param.setValueAtTime(cur, t);
      param.setTargetAtTime(0.0001, t, rel / 5);
    } catch (err) {
      /* rien */
    }
    v.oscs.forEach((o) => {
      try {
        o.stop(t + rel + 0.5);
      } catch (err) {
        /* déjà arrêté */
      }
    });
  }

  stopAll(release = 0.1) {
    Array.from(this.active.keys()).forEach((id) => this.noteOff(id, release));
  }
}

// ===== Piano.jsx =====
function Piano({ keys, activeIds, onNoteOn, onNoteOff }) {
  const keysRef = useRef(null);

  // iOS : l'appui long sur une touche déclenche la loupe / le zoom de
  // sélection. On bloque l'événement natif « touchstart » (React l'attache
  // en passif, d'où l'écouteur natif non passif) et le menu contextuel.
  // Les événements pointeur utilisés pour jouer ne sont pas affectés.
  useEffect(() => {
    const el = keysRef.current;
    if (!el) return;
    const stop = (e) => e.preventDefault();
    el.addEventListener("touchstart", stop, { passive: false });
    el.addEventListener("contextmenu", stop);
    return () => {
      el.removeEventListener("touchstart", stop);
      el.removeEventListener("contextmenu", stop);
    };
  }, []);

  const whites = useMemo(() => keys.filter((k) => !k.isBlack), [keys]);
  const blacks = useMemo(() => keys.filter((k) => k.isBlack), [keys]);
  const whiteW = 100 / whites.length;
  const blackW = whiteW * 0.62;

  return (
    <div className="piano">
      <div className="piano-keys" ref={keysRef}>
        {whites.map((k) => (
          <button
            key={k.id}
            type="button"
            className={`white-key${activeIds.has(k.id) ? " is-active" : ""}`}
            onPointerDown={(e) => {
              e.preventDefault();
              onNoteOn(k, "pointer");
            }}
            onPointerEnter={(e) => {
              if (e.buttons === 1) onNoteOn(k, "pointer");
            }}
            onPointerLeave={() => onNoteOff(k.id, "pointer")}
            aria-label={`${k.solfege} (${k.name})`}
          >
            <span className="key-note">{k.solfege}</span>
            {k.keyLabel && <span className="key-bind">{k.keyLabel}</span>}
          </button>
        ))}
        {blacks.map((k) => (
          <button
            key={k.id}
            type="button"
            className={`black-key${activeIds.has(k.id) ? " is-active" : ""}`}
            style={{ left: `${(k.whiteBefore + 1) * whiteW - blackW / 2}%`, width: `${blackW}%` }}
            onPointerDown={(e) => {
              e.preventDefault();
              onNoteOn(k, "pointer");
            }}
            onPointerEnter={(e) => {
              if (e.buttons === 1) onNoteOn(k, "pointer");
            }}
            onPointerLeave={() => onNoteOff(k.id, "pointer")}
            aria-label={`${k.solfege} (${k.name})`}
          >
            {k.keyLabel && <span className="key-bind">{k.keyLabel}</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// ===== midi.js =====
// Lecture de fichiers MIDI standard (SMF, formats 0/1/2) pour l'entraînement
// des choristes : nom des pistes, notes (hauteur, début, fin, vélocité) et
// carte de tempo. Analyse volontairement minimale, sans dépendance externe :
// tout ce qui est General MIDI avancé (pitch bend, percussions, contrôleurs)
// est simplement ignoré, seul le rythme et les notes comptent à l'oreille.

const DEFAULT_TEMPO = 500000; // microsecondes par noire (120 BPM)

// Quantité à longueur variable (Variable Length Quantity) du format MIDI.
function readVLQ(bytes, pos) {
  let value = 0;
  for (;;) {
    const b = bytes[pos++];
    value = (value << 7) | (b & 0x7f);
    if ((b & 0x80) === 0) break;
  }
  return [value, pos];
}

function readTag(bytes, pos) {
  return String.fromCharCode(bytes[pos], bytes[pos + 1], bytes[pos + 2], bytes[pos + 3]);
}

// Les noms de pistes des fichiers de chorales sont en Latin-1 en général.
function readText(bytes, pos, len) {
  let out = "";
  for (let i = 0; i < len; i++) out += String.fromCharCode(bytes[pos + i]);
  return out.trim();
}

// Analyse une piste : événements note on/off en temps « ticks » + tempos.
function parseTrackBytes(bytes, start, end) {
  let pos = start;
  let tick = 0;
  let running = 0;
  let name = "";
  const notes = [];
  const tempos = [];
  const open = new Map(); // canal×hauteur -> note en attente de note-off
  while (pos < end) {
    let [delta, p] = readVLQ(bytes, pos);
    pos = p;
    tick += delta;
    let status = bytes[pos];
    if (status < 0x80) {
      if (running === 0) break; // fichier endommagé
      status = running;
    } else {
      pos += 1;
      if (status < 0xf0) running = status; // les méta-événements ne comptent pas
    }
    if (status === 0xff) {
      const metaType = bytes[pos++];
      const [len, p2] = readVLQ(bytes, pos);
      pos = p2;
      if (metaType === 0x51 && len >= 3) {
        tempos.push({
          tick,
          usPerQuarter: (bytes[pos] << 16) | (bytes[pos + 1] << 8) | bytes[pos + 2],
        });
      } else if (metaType === 0x03 && !name) {
        name = readText(bytes, pos, len);
      } else if (metaType === 0x2f) {
        break; // fin de piste
      }
      pos += len;
    } else if (status === 0xf0 || status === 0xf7) {
      const [len, p2] = readVLQ(bytes, pos);
      pos = p2 + len;
    } else {
      const type = status & 0xf0;
      const channel = status & 0x0f;
      if (type === 0x90 || type === 0x80) {
        const pitch = bytes[pos];
        const velocity = bytes[pos + 1];
        pos += 2;
        const slot = channel * 128 + pitch;
        if (type === 0x90 && velocity > 0) {
          open.set(slot, { midi: pitch, velocity, startTick: tick });
        } else {
          const pending = open.get(slot);
          if (pending) {
            open.delete(slot);
            notes.push({
              midi: pending.midi,
              velocity: pending.velocity,
              startTick: pending.startTick,
              endTick: tick,
            });
          }
        }
      } else if (type === 0xc0 || type === 0xd0) {
        pos += 1; // changement de programme, pression de canal
      } else {
        pos += 2; // aftertouch polyphonique, contrôleurs, pitch bend
      }
    }
  }
  // Notes jamais refermées (fichier tronqué) : on les ferme au dernier tick.
  for (const pending of open.values()) {
    notes.push({
      midi: pending.midi,
      velocity: pending.velocity,
      startTick: pending.startTick,
      endTick: Math.max(tick, pending.startTick + 1),
    });
  }
  return { name, notes, tempos };
}

// Analyse un ArrayBuffer et renvoie { duration, tracks } avec les temps en
// secondes. Les pistes sans note (conducteur, tempo seul) ne sont pas listées.
function parseMidi(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length < 14 || readTag(bytes, 0) !== "MThd") {
    throw new Error("Ce fichier n'est pas un MIDI standard (SMF).");
  }
  const headerLen = (bytes[4] << 24) | (bytes[5] << 16) | (bytes[6] << 8) | bytes[7];
  const declaredTracks = (bytes[10] << 8) | bytes[11];
  const division = (bytes[12] << 8) | bytes[13];
  const smpte = (division & 0x8000) !== 0;
  const ticksPerQuarter = smpte ? 0 : division;
  const framesPerSecond = smpte ? 256 - (division >> 8) : 0;
  const ticksPerFrame = smpte ? division & 0xff : 0;

  let pos = 8 + headerLen;
  const raw = [];
  while (pos + 8 <= bytes.length && raw.length < declaredTracks) {
    if (readTag(bytes, pos) !== "MTrk") break;
    const len = (bytes[pos + 4] << 24) | (bytes[pos + 5] << 16) | (bytes[pos + 6] << 8) | bytes[pos + 7];
    if (len < 0) break; // longueur absurde : on s'arrête proprement
    const end = Math.min(pos + 8 + len, bytes.length);
    raw.push(parseTrackBytes(bytes, pos + 8, end));
    pos += 8 + len;
  }
  if (raw.length === 0) {
    throw new Error("Aucune piste MIDI trouvée dans ce fichier.");
  }

  // Carte de tempo globale : en format 1, la piste 0 porte les tempos,
  // mais on accepte les tempos où qu'ils soient, comme le font les séquenceurs.
  const tempos = [];
  for (const t of raw) tempos.push(...t.tempos);
  let tickToSec;
  if (smpte) {
    tickToSec = (tick) => tick / (framesPerSecond * ticksPerFrame);
  } else {
    tempos.sort((a, b) => a.tick - b.tick);
    if (tempos.length === 0 || tempos[0].tick > 0) {
      tempos.unshift({ tick: 0, usPerQuarter: DEFAULT_TEMPO });
    }
    const points = [];
    let sec = 0;
    for (let i = 0; i < tempos.length; i++) {
      points.push({ tick: tempos[i].tick, sec, usPerQuarter: tempos[i].usPerQuarter });
      if (i + 1 < tempos.length) {
        sec += ((tempos[i + 1].tick - tempos[i].tick) * tempos[i].usPerQuarter) / 1e6 / ticksPerQuarter;
      }
    }
    const last = points[points.length - 1];
    tickToSec = (tick) => {
      let point = last;
      for (let i = points.length - 1; i >= 0; i--) {
        if (points[i].tick <= tick) {
          point = points[i];
          break;
        }
      }
      return point.sec + ((tick - point.tick) * point.usPerQuarter) / 1e6 / ticksPerQuarter;
    };
  }

  let duration = 0;
  const tracks = [];
  raw.forEach((t, i) => {
    if (t.notes.length === 0) return; // piste de tempo seule : pas au menu
    const notes = t.notes
      .map((n) => ({
        midi: n.midi,
        velocity: n.velocity,
        start: tickToSec(n.startTick),
        end: tickToSec(n.endTick),
      }))
      .sort((a, b) => a.start - b.start);
    for (const n of notes) if (n.end > duration) duration = n.end;
    tracks.push({ name: t.name || "Piste " + (i + 1), notes });
  });
  if (tracks.length === 0) {
    throw new Error("Ce fichier MIDI ne contient aucune note.");
  }
  return { duration, tracks };
}

// Lecture d'une liste d'événements déjà triés. Un retard (timer) par événement
// suffit pour un fichier de répétition : quelques milliers de notes tiennent
// sans problème, et la précision d'une dizaine de millisecondes passe inaperçue
// pour se caler sur sa partie. Le lecteur mémorise sa position (en secondes du
// morceau) : pause, reprise, changement de vitesse en route et déplacement
// dans le morceau (seek) reposent sur le même mécanisme de reprogrammation.
function createMidiPlayer(events, duration, { onNoteOn, onNoteOff, onEnd }) {
  let timers = [];
  let playing = false;
  let speed = 1;
  let pos = 0; // position dans le morceau, en secondes
  let startedAt = 0; // performance.now() au (re)démarrage de la lecture

  const clearTimers = () => {
    for (const t of timers) clearTimeout(t);
    timers = [];
  };

  const getPos = () =>
    playing
      ? Math.min(pos + ((performance.now() - startedAt) / 1000) * speed, duration)
      : pos;

  // (Re)programme tous les événements postérieurs à la position courante.
  // Les événements passés sont ignorés : un note-off orphelin (note allumée
  // avant un saut) est inoffensif, l'appelant relâche déjà les notes tenues.
  const schedule = () => {
    for (const ev of events) {
      if (ev.t < pos) continue;
      timers.push(
        setTimeout(() => {
          if (!playing) return;
          if (ev.on) onNoteOn(ev.midi, ev.velocity);
          else onNoteOff(ev.midi);
        }, ((ev.t - pos) * 1000) / speed)
      );
    }
    timers.push(
      setTimeout(() => {
        if (playing) {
          playing = false;
          pos = duration;
          clearTimers();
          onEnd();
        }
      }, ((duration - pos) * 1000) / speed + 80)
    );
  };

  return {
    // Démarre ou reprend, éventuellement depuis une position donnée.
    play(newSpeed = 1, from = null) {
      clearTimers();
      speed = newSpeed;
      if (from !== null && from !== undefined) {
        pos = Math.min(Math.max(from, 0), duration);
      }
      playing = true;
      startedAt = performance.now();
      schedule();
    },
    pause() {
      if (!playing) return;
      pos = getPos();
      playing = false;
      clearTimers();
    },
    // Saute à une position : reprogramme les événements restants si on était
    // en lecture, sinon mémorise simplement la nouvelle position.
    seek(to) {
      const resume = playing;
      playing = false;
      clearTimers();
      pos = Math.min(Math.max(to, 0), duration);
      if (resume) {
        playing = true;
        startedAt = performance.now();
        schedule();
      }
    },
    getPos,
    stop() {
      playing = false;
      clearTimers();
    },
  };
}

// ===== songs.js =====
// Morceaux intégrés : le dossier « public/songs/ » de la branche `main` du
// dépôt GitHub héberge les fichiers. Celui qui gère le répertoire y dépose
// simplement des .mid via l'interface GitHub — aucun réglage côté code. L'app
// découvre la liste via l'API GitHub (dépôt public), puis charge le morceau
// choisi depuis raw.githubusercontent.com : les fichiers sont servis dès
// l'upload, sans attendre le déploiement Pages, et le service worker les met
// en cache après une première écoute pour un usage hors ligne.

const SONGS_API_URL =
  "https://api.github.com/repos/quentinperry/mini-piano/contents/public/songs?ref=main";
const SONGS_RAW_BASE =
  "https://raw.githubusercontent.com/quentinperry/mini-piano/main/public/songs/";
const SONGS_CACHE_KEY = "mini-piano-songs-v1";
const SONGS_CACHE_MAX_AGE = 24 * 3600 * 1000; // une relecture par jour suffit

// Libellé lisible à partir du nom de fichier : « 01kyrie.mid » s'affichera
// « 01 Kyrie ». Celui qui dépose les fichiers garde la main : espaces,
// accents et tirets dans le nom sont respectés tels quels.
function titleFromFileName(name) {
  return name
    .replace(/\.(mid|midi)$/i, "")
    .replace(/_+/g, " ")
    .replace(/(\d)(?=[A-Za-z\u00c0-\u017f])/g, "$1 ")
    .split(" ")
    .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : w))
    .join(" ")
    .trim();
}

// Liste des morceaux disponibles. En cas d'échec (hors ligne, quota API),
// on retombe sur la dernière liste connue, stockée localement.
async function listBuiltInSongs() {
  try {
    const res = await fetch(SONGS_API_URL, {
      headers: { Accept: "application/vnd.github+json" },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const entries = await res.json();
    const list = entries
      .filter((e) => e.type === "file" && /\.midi?$/i.test(e.name))
      .map((e) => ({ name: e.name, title: titleFromFileName(e.name) }))
      .sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true }));
    try {
      localStorage.setItem(SONGS_CACHE_KEY, JSON.stringify({ at: Date.now(), list }));
    } catch (err) {
      /* stockage indisponible (mode privé, quota) : sans conséquence */
    }
    return list;
  } catch (err) {
    try {
      const raw = JSON.parse(localStorage.getItem(SONGS_CACHE_KEY));
      if (raw && raw.list && Date.now() - raw.at < SONGS_CACHE_MAX_AGE) {
        return raw.list;
      }
    } catch (err2) {
      /* pas de liste connue : on remonte l'erreur */
    }
    throw err;
  }
}

// Charge le fichier MIDI d'un morceau intégré, depuis le dépôt.
async function fetchBuiltInSong(fileName) {
  const res = await fetch(SONGS_RAW_BASE + encodeURIComponent(fileName));
  if (!res.ok) {
    throw new Error("Impossible de charger ce morceau (" + res.status + ").");
  }
  return res.arrayBuffer();
}

// Tessitures chorales : base midi de chaque pupitre (mi = Do4).
// Ténor par défaut.
const TESSITURES = [
  { id: "soprano", label: "Soprano", base: 60 }, // Do4 – Do6 en paysage
  { id: "alto", label: "Alto", base: 55 },       // Sol3 – Sol5
  { id: "tenor", label: "Ténor", base: 48 },     // Do3 – Do5
  { id: "basse", label: "Basse", base: 40 },     // Mi2 – Mi4
];
const DEFAULT_TESSITURE = "tenor";
// Portrait : 17 demi-tons. Paysage : 25 demi-tons (toute la tessiture).
const NARROW_COUNT = 17;
const WIDE_COUNT = 25;

// Mesure la place réellement disponible via un ResizeObserver.
// Plus fiable que l'orientation annoncée par l'iframe (qui peut être fausse
// ou flotter pendant une rotation) : portrait ou paysage se déduit du
// rapport largeur/hauteur réellement rendu.
function formatMidiTime(t) {
  return `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
}

function useContainerSize() {
  const ref = useRef(null);
  const [size, setSize] = useState(() => ({
    width: typeof window !== "undefined" ? window.innerWidth : 0,
    height: typeof window !== "undefined" ? window.innerHeight : 0,
  }));
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const measure = () =>
      setSize({ width: el.clientWidth, height: el.clientHeight });
    measure();
    if (typeof ResizeObserver === "function") {
      const ro = new ResizeObserver(measure);
      ro.observe(el);
      return () => ro.disconnect();
    }
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, []);
  return { ref, size };
}

function PianoApp() {
  const { ref: rootRef, size } = useContainerSize();
  // Portrait : clavier compact (17 demi-tons). Paysage : étendu (25, toute
  // la tessiture). Le gabarit suit l'orientation réelle, sans réglage manuel.
  const isWide = size.width > 0 && size.width >= size.height;
  const [voiceId, setVoiceId] = useState(DEFAULT_TESSITURE);
  const [octave, setOctave] = useState(0);
  const [volume, setVolume] = useState(0.5);
  const [release, setRelease] = useState(0.35);
  const [activeIds, setActiveIds] = useState(() => new Set());
  const [lastNote, setLastNote] = useState(null);
  const [audioStatus, setAudioStatus] = useState("idle");
  const [fsAvailable, setFsAvailable] = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  // Fichier MIDI : analyse, piste choisie, vitesse, lecture en cours
  const [midi, setMidi] = useState(null);
  const [midiTrack, setMidiTrack] = useState("all");
  const [midiSpeed, setMidiSpeed] = useState(1);
  const [midiPlaying, setMidiPlaying] = useState(false);
  const [midiActiveIds, setMidiActiveIds] = useState(() => new Set());
  const [midiError, setMidiError] = useState(null);
  // Position dans le morceau (seconde), mémorisée d'une pause à l'autre
  const [midiProgress, setMidiProgress] = useState(0);
  // Morceaux intégrés : liste découverte au chargement (null = en cours),
  // morceau sélectionné dans le menu, morceau en cours de chargement
  const [songs, setSongs] = useState(null);
  const [selectedSong, setSelectedSong] = useState("");
  const [songLoading, setSongLoading] = useState(null);

  const synthRef = useRef(null);
  if (!synthRef.current) synthRef.current = new Synth();

  const midiPlayerRef = useRef(null);
  const midiHeldRef = useRef(new Set());
  const midiPosRef = useRef(0); // position de reprise, en secondes

  const settingsRef = useRef({ volume, release });
  settingsRef.current = { volume, release };

  const tessitura = TESSITURES.find((t) => t.id === voiceId) || TESSITURES[2];
  const keys = useMemo(
    () => buildKeys(tessitura.base + octave * 12, isWide ? WIDE_COUNT : NARROW_COUNT),
    [tessitura, octave, isWide]
  );
  const keyMap = useMemo(() => buildKeyMap(keys), [keys]);
  const keyByMidi = useMemo(() => new Map(keys.map((k) => [k.midi, k])), [keys]);

  const chooseVoice = (id) => {
    pauseMidi(); // les surbrillances MIDI ne suivraient plus le clavier
    setVoiceId(id);
    setOctave(0); // on recale le clavier sur la nouvelle tessiture
  };

  const shiftOctave = (d) => {
    pauseMidi();
    setOctave((o) => Math.min(2, Math.max(-2, o + d)));
  };

  const rangeText = `${keys[0].solfege} – ${keys[keys.length - 1].solfege}`;

  const pointerHeld = useRef(new Set());
  const keyHeld = useRef(new Set());

  const noteOn = (key) => {
    const s = settingsRef.current;
    if (synthRef.current.active.has(key.id)) return;
    const playing = synthRef.current.noteOn(key.id, midiToFreq(key.midi), {
      volume: s.volume,
    });
    setAudioStatus(audioState());
    if (!playing) return;
    setLastNote(key);
    setActiveIds((prev) => new Set(prev).add(key.id));
  };

  const noteOff = (id) => {
    synthRef.current.noteOff(id, settingsRef.current.release);
    setActiveIds((prev) => {
      if (!prev.has(id)) return prev;
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  };

  // Activation par défaut : on demande l'audio dès le chargement.
  // Les navigateurs qui l'autorisent sans geste l'activent ici ;
  // les autres le débloqueront au premier clic ou au premier appui touche.
  useEffect(() => {
    ensureAudio();
    setAudioStatus(audioState());
  }, []);

  // Plein écran : indisponible sur iPhone (Safari) et dans certaines iframes
  // de rendu, le bouton se cache alors automatiquement.
  useEffect(() => {
    if (typeof document === "undefined") return;
    setFsAvailable(!!document.fullscreenEnabled);
    const onChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onChange);
    return () => document.removeEventListener("fullscreenchange", onChange);
  }, []);

  const toggleFullscreen = () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  };

  // Déblocage audio : les navigateurs exigent un geste pour démarrer le son.
  // On réveille le contexte à chaque premier geste utile.
  useEffect(() => {
    const unlock = () => {
      ensureAudio();
      setAudioStatus(audioState());
    };
    window.addEventListener("pointerdown", unlock, true);
    window.addEventListener("keydown", unlock, true);
    return () => {
      window.removeEventListener("pointerdown", unlock, true);
      window.removeEventListener("keydown", unlock, true);
    };
  }, []);

  // Sortie pointeur : au relâchement global, on coupe les notes tenues à la souris
  useEffect(() => {
    const onUp = () => {
      pointerHeld.current.forEach((id) => noteOff(id));
      pointerHeld.current.clear();
    };
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    return () => {
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
    };
  }, []);

  // Clavier physique
  useEffect(() => {
    const down = (e) => {
      if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
      const key = keyMap[e.key.toLowerCase()];
      if (!key || keyHeld.current.has(key.id)) return;
      keyHeld.current.add(key.id);
      noteOn(key);
    };
    const up = (e) => {
      const key = keyMap[e.key.toLowerCase()];
      if (!key) return;
      keyHeld.current.delete(key.id);
      noteOff(key.id);
    };
    const blur = () => {
      keyHeld.current.forEach((id) => noteOff(id));
      keyHeld.current.clear();
    };
    window.addEventListener("keydown", down);
    window.addEventListener("keyup", up);
    window.addEventListener("blur", blur);
    return () => {
      window.removeEventListener("keydown", down);
      window.removeEventListener("keyup", up);
      window.removeEventListener("blur", blur);
    };
  }, [keyMap]);

  // Nettoyage au démontage / changement d'octave ou de gabarit
  useEffect(() => {
    return () => {
      synthRef.current.stopAll(0.05);
      if (midiPlayerRef.current) midiPlayerRef.current.stop();
      midiHeldRef.current.clear();
      keyHeld.current.clear();
      pointerHeld.current.clear();
    };
  }, [keys]);

  const handlePointerOn = (key, source) => {
    if (source === "pointer") {
      pointerHeld.current.add(key.id);
    }
    noteOn(key);
  };

  const handlePointerOff = (id, source) => {
    if (source === "pointer") pointerHeld.current.delete(id);
    noteOff(id);
  };

  // ---- Lecture d'un fichier MIDI : entraînement pupitre ----
  // Le choriste ouvre un fichier (souvent une piste par pupitre), choisit
  // sa voix, et suit en rythme : les touches s'illuminent, le son passe par
  // le même synthé que le clavier. La lecture se met en pause et se reprend
  // à la position mémorisée, et le curseur permet de naviguer dans le morceau.
  const releaseMidiNotes = () => {
    midiHeldRef.current.forEach((m) =>
      synthRef.current.noteOff("midi-" + m, settingsRef.current.release)
    );
    midiHeldRef.current.clear();
    setMidiActiveIds(new Set());
  };

  const pauseMidi = () => {
    if (midiPlayerRef.current) {
      midiPosRef.current = midiPlayerRef.current.getPos();
      midiPlayerRef.current.stop();
      midiPlayerRef.current = null;
    }
    releaseMidiNotes();
    setMidiPlaying(false);
    setMidiProgress(midiPosRef.current);
  };

  const handleMidiNoteOn = (midiNum, velocity) => {
    midiHeldRef.current.add(midiNum);
    const gain = settingsRef.current.volume * (0.35 + (0.65 * velocity) / 127);
    synthRef.current.noteOn("midi-" + midiNum, midiToFreq(midiNum), { volume: gain });
    const key = keyByMidi.get(midiNum);
    if (key) {
      setLastNote(key);
      setMidiActiveIds((prev) => new Set(prev).add(key.id));
    }
  };

  const handleMidiNoteOff = (midiNum) => {
    midiHeldRef.current.delete(midiNum);
    synthRef.current.noteOff("midi-" + midiNum, settingsRef.current.release);
    const key = keyByMidi.get(midiNum);
    if (key) {
      setMidiActiveIds((prev) => {
        if (!prev.has(key.id)) return prev;
        const next = new Set(prev);
        next.delete(key.id);
        return next;
      });
    }
  };

  const startMidi = (speed = midiSpeed, track = midiTrack, fromPos = midiPosRef.current) => {
    if (!midi) return;
    const notes =
      track === "all"
        ? midi.tracks.flatMap((t) => t.notes)
        : midi.tracks[Number(track)].notes;
    if (!notes.length) return;
    const events = [];
    let maxT = 0;
    for (const n of notes) {
      events.push({ t: n.start, on: true, midi: n.midi, velocity: n.velocity });
      events.push({ t: n.end, on: false, midi: n.midi });
      if (n.end > maxT) maxT = n.end;
    }
    // au même instant, on coupe la note avant d'en rallumer une
    events.sort((a, b) => a.t - b.t || (a.on ? 1 : 0) - (b.on ? 1 : 0));
    ensureAudio();
    midiPlayerRef.current = createMidiPlayer(events, maxT, {
      onNoteOn: handleMidiNoteOn,
      onNoteOff: handleMidiNoteOff,
      onEnd: () => {
        midiPlayerRef.current = null;
        midiPosRef.current = 0; // morceau terminé : une relecture repart du début
        setMidiPlaying(false);
        releaseMidiNotes();
        setMidiProgress(maxT);
      },
    });
    midiPlayerRef.current.play(speed, fromPos);
    setMidiPlaying(true);
  };

  const toggleMidi = () =>
    midiPlaying ? pauseMidi() : startMidi();

  // Saut dans le morceau : on relâche les notes tenues, puis on reprogramme
  // la lecture depuis la nouvelle position (les notes déjà passées ne sonnent
  // pas, leurs note-off orphelins sont sans effet).
  const seekMidi = (t) => {
    if (!midi) return;
    const to = Math.min(Math.max(t, 0), midi.duration);
    midiPosRef.current = to;
    releaseMidiNotes();
    if (midiPlaying && midiPlayerRef.current) {
      midiPlayerRef.current.seek(to);
    } else {
      setMidiProgress(to);
    }
  };

  // Barre de progression : rafraîchie pendant la lecture uniquement.
  useEffect(() => {
    if (!midiPlaying) return;
    const id = setInterval(() => {
      if (midiPlayerRef.current) setMidiProgress(midiPlayerRef.current.getPos());
    }, 200);
    return () => clearInterval(id);
  }, [midiPlaying]);

  // Morceaux intégrés : liste découverte au démarrage. En cas d'échec
  // (hors ligne, quota), le menu ne s'affiche pas et l'ouverture manuelle
  // d'un fichier reste disponible.
  useEffect(() => {
    let alive = true;
    listBuiltInSongs()
      .then((list) => {
        if (alive) setSongs(list);
      })
      .catch(() => {
        if (alive) setSongs([]);
      });
    return () => {
      alive = false;
    };
  }, []);

  // Changer de piste ou de vitesse garde la position : on poursuit au même
  // endroit du morceau, comme le ferait un lecteur audio.
  const changeMidiTrack = (e) => {
    const track = e.target.value;
    setMidiTrack(track);
    if (midiPlaying) {
      pauseMidi();
      startMidi(midiSpeed, track);
    }
  };

  const changeMidiSpeed = (e) => {
    const speed = Number(e.target.value);
    setMidiSpeed(speed);
    if (midiPlaying) {
      pauseMidi();
      startMidi(speed, midiTrack);
    }
  };

  const handleMidiFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // permet de rouvrir le même fichier
    if (!file) return;
    pauseMidi();
    midiPosRef.current = 0; // nouveau fichier : on repart du début
    setMidiProgress(0);
    setSelectedSong(""); // le menu des morceaux intégrés ne suit plus
    try {
      const parsed = parseMidi(await file.arrayBuffer());
      setMidi({ name: file.name, duration: parsed.duration, tracks: parsed.tracks });
      setMidiTrack("all");
      setMidiError(null);
    } catch (err) {
      setMidi(null);
      setMidiError(String(err && err.message ? err.message : err));
    }
  };

  // Morceau intégré : même chemin que l'ouverture d'un fichier, seul le
  // transport change (téléchargement depuis le site au lieu d'un upload).
  const chooseBuiltInSong = async (e) => {
    const fileName = e.target.value;
    setSelectedSong(fileName);
    if (!fileName) return;
    pauseMidi();
    midiPosRef.current = 0;
    setMidiProgress(0);
    setMidi(null);
    setMidiError(null);
    setSongLoading(fileName);
    try {
      const parsed = parseMidi(await fetchBuiltInSong(fileName));
      const song = (songs || []).find((s) => s.name === fileName);
      setMidi({
        name: song ? song.title : fileName,
        duration: parsed.duration,
        tracks: parsed.tracks,
      });
      setMidiTrack("all");
    } catch (err) {
      setMidi(null);
      setMidiError(String(err && err.message ? err.message : err));
    } finally {
      setSongLoading(null);
    }
  };

  return (
    <div
      className={`piano-app ${isWide ? "layout-wide" : "layout-narrow"}`}
      ref={rootRef}
    >
      <header className="piano-header">
        <h1>Mini Piano</h1>
        <p className="piano-sub">
          Choisissez votre pupitre (soprano, alto, ténor par défaut, basse) puis jouez la note pour vous caler. En paysage, toute la tessiture s'affiche, aigus compris. Au premier chargement, appuyez deux fois sur une touche : la première autorise l'audio, la seconde joue.
        </p>
      </header>

      <div className={`audio-badge audio-${audioStatus}`} role="status">
        {audioStatus === "running"
          ? "Audio actif"
          : audioStatus === "idle"
            ? "Au début, appuyez deux fois sur une touche pour lancer le son"
            : "Audio en veille : appuyez deux fois sur une touche pour lancer le son"}
      </div>

      <div className="piano-display">
        <span className="piano-display-note">{lastNote ? lastNote.solfege : "·"}</span>
        {lastNote && (
          <span className="piano-display-freq">
            {lastNote.name} · {midiToFreq(lastNote.midi).toFixed(1)} Hz
          </span>
        )}
      </div>

      <Piano
        keys={keys}
        activeIds={midiActiveIds.size ? new Set([...activeIds, ...midiActiveIds]) : activeIds}
        onNoteOn={handlePointerOn}
        onNoteOff={handlePointerOff}
      />

      <div className="piano-controls">
        <div className="control-group">
          <span className="control-label">Tessiture</span>
          <div className="voice-btns">
            {TESSITURES.map((t) => (
              <button
                key={t.id}
                type="button"
                className={t.id === voiceId ? "is-selected" : ""}
                onClick={() => chooseVoice(t.id)}
              >
                {t.label}
              </button>
            ))}
          </div>
          <span className="piano-range">{rangeText}</span>
        </div>

        {fsAvailable && (
          <div className="control-group">
            <span className="control-label">Affichage</span>
            <div className="voice-btns">
              <button type="button" onClick={toggleFullscreen}>
                {isFullscreen ? "Quitter plein écran" : "Plein écran"}
              </button>
            </div>
          </div>
        )}

        <div className="control-group">
          <span className="control-label">Octave</span>
          <div className="octave-btns">
            <button type="button" onClick={() => shiftOctave(-1)} aria-label="Octave en dessous">
              −
            </button>
            <span className="octave-value">{octave >= 0 ? `+${octave}` : octave}</span>
            <button type="button" onClick={() => shiftOctave(1)} aria-label="Octave au-dessus">
              +
            </button>
          </div>
        </div>

        <div className="control-group">
          <span className="control-label">Volume</span>
          <input
            type="range"
            min="0"
            max="1"
            step="0.05"
            value={volume}
            onChange={(e) => setVolume(Number(e.target.value))}
          />
        </div>

        <div className="control-group">
          <span className="control-label">Sustain</span>
          <input
            type="range"
            min="0.05"
            max="1.5"
            step="0.05"
            value={release}
            onChange={(e) => setRelease(Number(e.target.value))}
          />
        </div>

        <div className="control-group">
          <span className="control-label">Fichier MIDI</span>
          <div className="voice-btns">
            <label className="midi-btn">
              Ouvrir un MIDI…
              <input
                type="file"
                accept=".mid,.midi,audio/midi"
                hidden
                onChange={handleMidiFile}
              />
            </label>
          </div>
          {songs === null && (
            <div className="voice-btns">
              <select disabled aria-label="Morceaux intégrés">
                <option>Liste des morceaux…</option>
              </select>
            </div>
          )}
          {songs !== null && songs.length > 0 && (
            <div className="voice-btns">
              <select
                value={selectedSong}
                onChange={chooseBuiltInSong}
                aria-label="Morceaux intégrés"
              >
                <option value="">Morceaux intégrés…</option>
                {songs.map((s) => (
                  <option key={s.name} value={s.name}>
                    {s.title}
                  </option>
                ))}
              </select>
            </div>
          )}
          {songLoading && <span className="midi-file">Chargement du morceau…</span>}
          {midi && (
            <>
              <span className="midi-file">
                {midi.name} · {formatMidiTime(midi.duration)}
              </span>
              <div className="midi-seek">
                <span className="midi-time">{formatMidiTime(Math.min(midiProgress, midi.duration))}</span>
                <input
                  type="range"
                  min="0"
                  max={midi.duration}
                  step="0.1"
                  value={Math.min(midiProgress, midi.duration)}
                  onChange={(e) => seekMidi(Number(e.target.value))}
                  aria-label="Position dans le morceau"
                />
                <span className="midi-time">{formatMidiTime(midi.duration)}</span>
              </div>
              <div className="voice-btns midi-row">
                <select value={midiTrack} onChange={changeMidiTrack} aria-label="Piste à jouer">
                  <option value="all">Toutes les pistes</option>
                  {midi.tracks.map((t, i) => (
                    <option key={i} value={String(i)}>
                      {t.name} ({t.notes.length})
                    </option>
                  ))}
                </select>
                <select value={midiSpeed} onChange={changeMidiSpeed} aria-label="Vitesse de lecture">
                  {[0.5, 0.75, 1, 1.25, 1.5].map((s) => (
                    <option key={s} value={String(s)}>
                      ×{s}
                    </option>
                  ))}
                </select>
                <button type="button" onClick={toggleMidi}>
                  {midiPlaying
                    ? "Pause"
                    : midiProgress > 0.05 && midiProgress < midi.duration - 0.05
                      ? "Reprendre"
                      : "Lire"}
                </button>
              </div>
            </>
          )}
          {midiError && <span className="midi-file midi-error">{midiError}</span>}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PianoApp />);
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
